name: Bug report
description: Something in Fileglow does not work, looks wrong or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. One problem per report, please.
        Before you attach a screenshot, crop or cover anything private: file names, share addresses and photos. Issues here are public.
  - type: input
    id: version
    attributes:
      label: App version
      description: "In the app: Settings, About. Or Android settings, Apps, Fileglow."
      placeholder: "1.4.9"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone, tablet or TV model
      description: Android settings, About phone.
      placeholder: Pixel 8
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Android settings, About phone, Android version.
      placeholder: "15"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which screen or feature?"
      options:
        - "home"
        - "files (browsing and folders)"
        - "find"
        - "selection and file actions"
        - "copy, move and paste"
        - "file jobs after leaving the app"
        - "names already here (keep both, skip, replace)"
        - "rename"
        - "zip and unzip"
        - "trash and undo"
        - "previews"
        - "photo viewer"
        - "details view and grid sizes"
        - "open with and send to another app"
        - "picker for other apps or save a copy"
        - "installing app files"
        - "settings"
        - "look and themes"
        - "launcher looks (phosphor or hyprtile)"
        - "privacy page"
        - "pro and the purchase"
        - "network shares (smb, sftp, ftp, webdav)"
        - "dropbox and onedrive"
        - "films from a share"
        - "wi-fi transfer"
        - "vault"
        - "archives as folders"
        - "search inside files"
        - "two tiles and workspaces"
        - "folder mirrors"
        - "find duplicates"
        - "sort photos and put photos back"
        - "app data with shizuku"
        - "accessibility (talkback, text size)"
        - "tv: side rail and remote"
        - "tv: actions and sheets"
        - "tv: open with"
        - "tv: usb drives"
        - "tv: qr codes (open on your phone)"
        - "other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or screen recording
      description: Drag the file in here. A short recording helps a lot with bugs in file jobs.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this is not there yet.
          required: true
        - label: My screenshots show nothing private.
          required: true
